<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - HomeOS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary-container": "#cdced0",
                    "inverse-surface": "#27313f",
                    "on-secondary-container": "#5e6572",
                    "inverse-on-surface": "#eaf1ff",
                    "surface-dim": "#d0dbed",
                    "on-surface": "#121c2a",
                    "on-primary": "#ffffff",
                    "background": "#f8f9ff",
                    "surface-tint": "#316289",
                    "primary-fixed-dim": "#9ccbf7",
                    "surface-container": "#e6eeff",
                    "on-secondary": "#ffffff",
                    "tertiary-fixed-dim": "#c5c6c8",
                    "secondary": "#585f6c",
                    "secondary-fixed": "#dce2f3",
                    "surface-container-high": "#dee9fc",
                    "on-tertiary-fixed": "#191c1e",
                    "on-primary-fixed-variant": "#124a6f",
                    "secondary-fixed-dim": "#c0c7d6",
                    "surface-bright": "#f8f9ff",
                    "primary-container": "#2a5c82",
                    "on-primary-container": "#a5d4ff",
                    "on-background": "#121c2a",
                    "inverse-primary": "#9ccbf7",
                    "secondary-container": "#dce2f3",
                    "outline-variant": "#c1c7cf",
                    "surface": "#f8f9ff",
                    "on-error": "#ffffff",
                    "error-container": "#ffdad6",
                    "surface-container-low": "#eff4ff",
                    "tertiary-container": "#56585a",
                    "on-secondary-fixed": "#151c27",
                    "on-tertiary-fixed-variant": "#444749",
                    "on-secondary-fixed-variant": "#404754",
                    "tertiary": "#3e4143",
                    "outline": "#72787f",
                    "on-primary-fixed": "#001d32",
                    "on-surface-variant": "#41474e",
                    "surface-variant": "#d9e3f6",
                    "primary-fixed": "#cde5ff",
                    "tertiary-fixed": "#e1e2e4",
                    "error": "#ba1a1a",
                    "surface-container-lowest": "#ffffff",
                    "surface-container-highest": "#d9e3f6",
                    "on-tertiary": "#ffffff",
                    "on-error-container": "#93000a",
                    "primary": "#074469"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "sm": "8px",
                    "margin": "32px",
                    "unit": "4px",
                    "lg": "24px",
                    "max_width": "1440px",
                    "gutter": "20px",
                    "xl": "48px",
                    "xs": "4px",
                    "md": "16px"
            },
            "fontFamily": {
                    "label-sm": ["Inter"],
                    "label-md": ["Inter"],
                    "body-md": ["Inter"],
                    "h1": ["Inter"],
                    "body-lg": ["Inter"],
                    "h3": ["Inter"],
                    "h2": ["Inter"]
            },
            "fontSize": {
                    "label-sm": ["12px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }],
                    "label-md": ["14px", { "lineHeight": "1.4", "letterSpacing": "0.01em", "fontWeight": "500" }],
                    "body-md": ["16px", { "lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400" }],
                    "h1": ["36px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                    "body-lg": ["18px", { "lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400" }],
                    "h3": ["20px", { "lineHeight": "1.4", "letterSpacing": "0", "fontWeight": "600" }],
                    "h2": ["28px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }]
            }
          }
        }
      }
    </script>
</head>
<body class="bg-background min-h-screen flex flex-col items-center justify-center relative overflow-hidden font-body-md text-on-surface">
<!-- Subtle Background Elements -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-40">
<div class="absolute top-[-10%] left-[-5%] w-[40vw] h-[40vw] rounded-full bg-surface-container-high blur-[100px]"></div>
<div class="absolute bottom-[-10%] right-[-5%] w-[50vw] h-[50vw] rounded-full bg-surface-container-low blur-[120px]"></div>
</div>
<!-- Main Content Canvas -->
<main class="w-full max-w-[480px] z-10 px-margin flex flex-col items-center">
<!-- Brand Header -->
<div class="text-center mb-xl">
<h1 class="font-h1 text-h1 text-primary mb-xs">HomeOS</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Your Digital Sanctuary</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest w-full rounded-[16px] shadow-[0_4px_20px_rgba(0,0,0,0.05)] border border-outline-variant/30 p-lg sm:p-margin flex flex-col gap-lg relative">
<div class="flex flex-col gap-sm text-center mb-sm">
<h2 class="font-h2 text-h2 text-on-surface">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Log in to manage your household.</p>
</div>
<form class="flex flex-col gap-md">
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="w-full h-12 pl-xl pr-md rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary transition-colors outline-none" id="email" placeholder="name@household.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full h-12 pl-xl pr-md rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary transition-colors outline-none" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-sm mt-xs">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary bg-surface-container-lowest cursor-pointer" id="remember" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer select-none" for="remember">Remember me</label>
</div>
<!-- Primary Action -->
<button class="w-full h-12 mt-sm bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md rounded-lg transition-colors flex items-center justify-center gap-sm" type="submit">
                    Log In
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</form>
<div class="flex items-center gap-md py-sm">
<div class="h-px bg-outline-variant/50 flex-1"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">or</span>
<div class="h-px bg-outline-variant/50 flex-1"></div>
</div>
<!-- Secondary Action -->
<button class="w-full h-12 bg-surface-container-lowest border border-outline-variant hover:bg-surface-container-low text-on-surface font-label-md text-label-md rounded-lg transition-colors flex items-center justify-center" type="button">
                Create an Account
            </button>
</div>
</main>
<!-- Footer Badge -->
<div class="fixed bottom-lg left-1/2 -translate-x-1/2 z-20">
<div class="bg-surface-container px-md py-sm rounded-full flex items-center gap-sm shadow-sm border border-outline-variant/20">
<span class="material-symbols-outlined text-primary text-[16px]" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Powered by InsForge</span>
</div>
</div>
</body></html>
