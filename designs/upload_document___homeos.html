<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Upload Document - HomeOS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-secondary-fixed-variant": "#404754",
                      "on-tertiary-fixed-variant": "#444749",
                      "surface-tint": "#316289",
                      "on-tertiary-container": "#cdced0",
                      "surface-dim": "#d0dbed",
                      "surface-container-highest": "#d9e3f6",
                      "on-surface": "#121c2a",
                      "tertiary-fixed-dim": "#c5c6c8",
                      "primary-fixed-dim": "#9ccbf7",
                      "on-primary-fixed-variant": "#124a6f",
                      "on-primary": "#ffffff",
                      "surface-container": "#e6eeff",
                      "primary-container": "#2a5c82",
                      "on-secondary-container": "#5e6572",
                      "outline": "#72787f",
                      "secondary-fixed-dim": "#c0c7d6",
                      "on-primary-fixed": "#001d32",
                      "on-secondary-fixed": "#151c27",
                      "on-tertiary-fixed": "#191c1e",
                      "surface-container-lowest": "#ffffff",
                      "on-surface-variant": "#41474e",
                      "inverse-on-surface": "#eaf1ff",
                      "error-container": "#ffdad6",
                      "error": "#ba1a1a",
                      "inverse-surface": "#27313f",
                      "on-secondary": "#ffffff",
                      "surface-container-high": "#dee9fc",
                      "secondary": "#585f6c",
                      "on-error": "#ffffff",
                      "surface-variant": "#d9e3f6",
                      "on-primary-container": "#a5d4ff",
                      "surface": "#f8f9ff",
                      "surface-container-low": "#eff4ff",
                      "tertiary-fixed": "#e1e2e4",
                      "tertiary-container": "#56585a",
                      "tertiary": "#3e4143",
                      "secondary-container": "#dce2f3",
                      "on-background": "#121c2a",
                      "inverse-primary": "#9ccbf7",
                      "on-error-container": "#93000a",
                      "background": "#f8f9ff",
                      "outline-variant": "#c1c7cf",
                      "primary-fixed": "#cde5ff",
                      "secondary-fixed": "#dce2f3",
                      "primary": "#074469",
                      "on-tertiary": "#ffffff",
                      "surface-bright": "#f8f9ff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "sm": "8px",
                      "max_width": "1440px",
                      "xs": "4px",
                      "margin": "32px",
                      "lg": "24px",
                      "gutter": "20px",
                      "md": "16px",
                      "xl": "48px",
                      "unit": "4px"
              },
              "fontFamily": {
                      "h1": ["Inter"],
                      "h2": ["Inter"],
                      "label-md": ["Inter"],
                      "h3": ["Inter"],
                      "label-sm": ["Inter"],
                      "body-md": ["Inter"],
                      "body-lg": ["Inter"]
              },
              "fontSize": {
                      "h1": ["36px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "h2": ["28px", {"lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "label-md": ["14px", {"lineHeight": "1.4", "letterSpacing": "0.01em", "fontWeight": "500"}],
                      "h3": ["20px", {"lineHeight": "1.4", "letterSpacing": "0", "fontWeight": "600"}],
                      "label-sm": ["12px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600"}],
                      "body-md": ["16px", {"lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400"}],
                      "body-lg": ["18px", {"lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400"}]
              }
            }
          }
        }
    </script>
</head>
<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex items-center justify-center p-md">
<!-- Modal Backdrop -->
<div aria-hidden="true" class="fixed inset-0 bg-on-surface/40 backdrop-blur-sm z-40"></div>
<!-- Modal Container -->
<div aria-labelledby="modal-title" aria-modal="true" class="relative z-50 w-full max-w-2xl bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] border border-outline-variant flex flex-col max-h-[921px] overflow-hidden" role="dialog">
<!-- Header -->
<div class="flex items-center justify-between px-lg py-md border-b border-outline-variant/50 bg-surface-container-lowest">
<h2 class="font-h2 text-h2 text-on-surface" id="modal-title">Upload Document</h2>
<button aria-label="Close modal" class="p-sm rounded-full text-on-surface-variant hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Body -->
<div class="p-lg overflow-y-auto flex-1 flex flex-col gap-lg bg-surface-container-lowest">
<!-- Drag and Drop Area -->
<div class="border-2 border-dashed border-outline-variant rounded-lg p-xl flex flex-col items-center justify-center gap-md bg-surface-container-low hover:bg-surface-container-high transition-colors cursor-pointer group">
<div class="p-md rounded-full bg-surface-container-highest text-primary group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined text-[32px]">upload_file</span>
</div>
<div class="text-center">
<p class="font-body-lg text-body-lg text-on-surface font-medium">Click to upload or drag and drop</p>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">PDF, JPG, PNG, or DOC (max. 10MB)</p>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<!-- Document Name -->
<div class="flex flex-col gap-xs md:col-span-2">
<label class="font-label-md text-label-md text-on-surface" for="doc-name">Document Name</label>
<input class="w-full bg-surface-container-lowest border border-outline rounded-DEFAULT px-md py-sm font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow placeholder:text-on-surface-variant/50" id="doc-name" placeholder="e.g. Fridge Warranty" type="text"/>
</div>
<!-- Category -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="doc-category">Category</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-lowest border border-outline rounded-DEFAULT pl-md pr-[40px] py-sm font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow" id="doc-category">
<option disabled="" selected="" value="">Select category</option>
<option value="manuals">Manuals &amp; Guides</option>
<option value="receipts">Receipts</option>
<option value="warranties">Warranties</option>
<option value="insurance">Insurance</option>
<option value="other">Other</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Expiry Date -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="doc-expiry">Expiry Date (Optional)</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline rounded-DEFAULT px-md py-sm font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow" id="doc-expiry" type="date"/>
</div>
</div>
<!-- Link to Asset -->
<div class="flex flex-col gap-xs md:col-span-2">
<label class="font-label-md text-label-md text-on-surface" for="doc-asset">Link to Household Asset (Optional)</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">link</span>
</div>
<input class="w-full bg-surface-container-lowest border border-outline rounded-DEFAULT pl-[40px] pr-md py-sm font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow placeholder:text-on-surface-variant/50" id="doc-asset" placeholder="Search assets (e.g. Kitchen Refrigerator)" type="text"/>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-xs">Linking helps organize documents by appliance or room.</p>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="px-lg py-md border-t border-outline-variant/50 bg-surface-container-lowest flex justify-end gap-md">
<button class="px-lg py-sm rounded-DEFAULT border border-outline text-on-surface font-label-md text-label-md hover:bg-surface-container-low transition-colors">Cancel</button>
<button class="px-lg py-sm rounded-DEFAULT bg-primary text-on-primary font-label-md text-label-md hover:bg-on-primary-fixed-variant transition-colors shadow-sm">Upload Document</button>
</div>
</div>
</body></html>
