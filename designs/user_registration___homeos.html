<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HomeOS - Create Account</title>

                        "primary-fixed": "#cde5ff",
                        "outline-variant": "#c1c7cf",
                        "tertiary-fixed": "#e1e2e4",

                        "tertiary": "#3e4143",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-md text-on-surface font-body-md">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.05)] border border-outline-variant p-lg md:p-xl flex flex-col gap-lg">
<!-- Header -->
<div class="text-center flex flex-col items-center gap-sm">
<span class="material-symbols-outlined text-[48px] text-primary" data-icon="home" data-weight="fill" style="font-variation-settings: 'FILL' 1;">home</span>
<h1 class="font-h1 text-h1 text-primary">HomeOS</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Start your digital sanctuary</p>
</div>
<!-- Registration Form -->
<form action="#" class="flex flex-col gap-md" method="POST">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="person">person</span>
<input class="w-full pl-xl pr-sm py-sm rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors font-body-md text-body-md" id="fullName" name="fullName" placeholder="Jane Doe" type="text"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="mail">mail</span>
<input class="w-full pl-xl pr-sm py-sm rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors font-body-md text-body-md" id="email" name="email" placeholder="jane@example.com" type="email"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full pl-xl pr-sm py-sm rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors font-body-md text-body-md" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<button class="mt-sm w-full bg-primary text-on-primary font-label-md text-label-md py-sm px-lg rounded-lg hover:bg-primary-container hover:text-on-primary-container transition-colors shadow-sm flex items-center justify-center gap-sm" type="submit">
                Create Account
                <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Footer Links -->
<div class="text-center font-body-md text-body-md text-on-surface-variant border-t border-outline-variant pt-md">
            Already have an account? 
            <a class="text-primary hover:text-primary-fixed-dim font-label-md text-label-md transition-colors underline-offset-4 hover:underline" href="#">Sign In</a>
</div>
</div>
</body></html>
